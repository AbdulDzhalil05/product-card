<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Abdusalamov Abduldzhalil Ruslamovich">
  <meta name="description" content="В нашем интернет магазине, вы сможете приобрести товары по уходу за кожей">
  <meta name="keywords" content="Товары для ухода за кожей, увлажняющий мусс, увлажняющий маска, гель для умывания">
  <title>Интернет магазин товаров для ухода за кожей</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="products">
    <div class="products__modal modal">
      <form class="modal__form" action="">
        <button class="modal__close">X</button>
        <input type="text" name="firstName" placeholder="Имя" pattern="^[А-Яа-яЁёA-Za-z]+$" required>
        <input type="text" name="lastName" placeholder="Фамилия" pattern="^[А-Яа-яЁёA-Za-z]+$" required>
        <input type="date" name="birthDate" placeholder="Дата рождения" required>
        <input type="text" name="login" placeholder="Логин" pattern="^[A-Za-z][A-Za-z0-9_]{2,19}$" required>
        <input id="password" type="password" name="password" placeholder="Пароль" required>
        <div class="modal__confirmPassword">
          <input id="confirmPassword" type="password" name="confirmPassword" placeholder="Подтвердите пароль" required>
        </div>
        <div class="modal__button">
          <button id="buttonSendForm" type="submit">Отправить</button>
          <button type="reset">Сбросить</button>
        </div>
      </form>
    </div>
    <div class="products__button-container">
      <button id="change-own-color-button" class="products__button"> Изменить цвет кнопки</button>
      <button id="change-bgcolor-first-card-button" class="products__button">Изменить цвет фона первой карточки</button>
      <button id="change-bgcolor-all-card-button" class="products__button">Изменить цвет фона первой карточки</button>
      <button id="open-google-page-button" class="products__button">Открыть сайт Google</button>
      <button id="message-output-button" class="products__button">Вывод сообщения</button>
      <button id="register-btn" class="products__register">Регистрация</button>
    </div>
    <h1 class="products__title">Выбери свой продукт</h1>
    <div class="products__container">
      <div class="products__cards">

        <div class="products__background">
          <img src="images/background_dandelions.png" alt="Фон одуванчики" width="790" height="697">
        </div>

        <template id="product-template">
          <article class="products__card card">
            <div class="card__image">
              <img src="" alt="" width="290">
            </div>
            <span class="card__category">для нормальной кожи</span>
            <h2 class="card__title"></h2>
            <p class="card__description"></p>
            <span class="card__ingredients">Состав: </span>
            <ul class="card__list">
            </ul>
            <div class="card__price">
              <b>Цена</b>
              <span></span>
            </div>
          </article>
        </template>

      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer__container">
      <div class="footer__column">
        <h3 class="footer__title">Product Cards</h3>
        <p class="footer__text">У нас самые лучшие продукты для кожи!</p>
        <a class="footer__icom-tg" href=""><img src="images/icon/tg_icon.svg" alt="" width="21"></a>
        <a class="footer__icom-vk" href=""><img src="images/icon/vk_icon.svg" alt="" width="24"></a>
      </div>
      <div class="footer__column">
        <form class="footer__form form" action="" method="post">
          <label class="form__label" for="email">Подпишись на наши акции:</label>
          <div class="form__container">
            <input id="form__email" type="email" name="email" placeholder="Введи Email..." required>
            <button class="form__button" type="submit">Подписаться</button>
          </div>
        </form>
      </div>
      <div class="footer__column">
        <nav class="footer__nav">
          <h3 class="footer__nav-title">Быстрые ссылки</h3>
          <ul class="footer__nav-list">
            <li><a class="footer__nav-link" href="">Главная</a></li>
            <li><a class="footer__nav-link" href="">Магазин</a></li>
            <li><a class="footer__nav-link" href="">Контакты</a></li>
          </ul>
        </nav>
      </div>
    </div>
    <div class="footer__line-container">
      <div class="footer__line"></div>
    </div>
    <p class="footer__copyright">www.product-cards.com©all right reserve</p>
  </footer>

  <script src="js/homework-7.js"></script>
  <script src="js/homework-8.js"></script>
  <script type="module" src="js/homework-9.js"></script>
  <script type="module" src="js/homework-10.js"></script>
  <script src="js/main.js" defer></script>
  <script src="js/homework-11.js"></script>

</body>

</html>
